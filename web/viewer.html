<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Koltuktan Saha Görünümü</title>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --bg:#EDEFEB; --surface:#FFFFFF; --surface-2:#F5F6F3; --surface-3:#E4E7E2;
  --text:#13171A; --muted:#58616A; --line:#D7DBD4; --line-strong:#B6BDB4;
  --overlay:rgba(255,255,255,.9); --scrim:rgba(19,23,26,.38);
  --shadow:0 1px 2px rgba(19,23,26,.06),0 8px 28px rgba(19,23,26,.08);
  --brand:#0B6E4F; --brand-ink:#FFFFFF; --accent:#C6F432; --accent-ink:#13171A;
  --cat1:#E0502A; --cat2:#E39B12; --cat3:#22968A; --cat4:#4A77D4; --cat5:#7A8496; --cat-vip:#8B4FC8;
  --sold:#BCC1BA; --ok:#1C7A4B; --danger:#B3261E; --warn:#9A5B00; --warn-bg:#FFF1D6;
  --scene-bg:#C6CBC5; --scene-concrete:#AEB4AD; --scene-concrete-2:#A2A8A1; --scene-wall:#8F958E;
  --scene-roof:#6E746E; --scene-floor:#5B605B; --scene-dim:#9EA59D; --scene-dim-amt:.3; --map-dim:.66; --scene-truss:#8C928B;
  --font-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1012; --surface:#15191C; --surface-2:#1B2023; --surface-3:#242A2E;
    --text:#E6E9E5; --muted:#99A2A9; --line:#2A3136; --line-strong:#3B444B;
    --overlay:rgba(21,25,28,.9); --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --sold:#454C52; --warn:#F2B04A; --warn-bg:rgba(242,176,74,.14);
    --scene-bg:#0A0C0E; --scene-concrete:#3A4146; --scene-concrete-2:#32383D; --scene-wall:#262B30;
    --scene-roof:#111417; --scene-floor:#181C1F; --scene-dim:#30363B; --scene-dim-amt:.62; --map-dim:.4; --scene-truss:#2B3136;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1012; --surface:#15191C; --surface-2:#1B2023; --surface-3:#242A2E;
  --text:#E6E9E5; --muted:#99A2A9; --line:#2A3136; --line-strong:#3B444B;
  --overlay:rgba(21,25,28,.9); --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --sold:#454C52; --warn:#F2B04A; --warn-bg:rgba(242,176,74,.14);
  --scene-bg:#0A0C0E; --scene-concrete:#3A4146; --scene-concrete-2:#32383D; --scene-wall:#262B30;
  --scene-roof:#111417; --scene-floor:#181C1F; --scene-dim:#30363B; --scene-dim-amt:.62; --map-dim:.4; --scene-truss:#2B3136;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:650;letter-spacing:-.01em;margin:0}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1600px;margin:0 auto}

/* Header */
.top{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;background:var(--brand);color:var(--brand-ink);
  font-family:var(--font-display);font-weight:750;font-size:15px;letter-spacing:.06em;white-space:nowrap}
.logo i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:8px;font-style:normal}
.event{min-width:0;flex:1}
.event h1{font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event p{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.only-wide{display:inline-flex}
.spacer{display:none;flex:1}
[hidden]{display:none !important}
.hint[hidden]{display:block !important;opacity:0}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

/* Main layout */
.main{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:12px;min-height:0;min-width:0}
.side{min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding-bottom:4px;scrollbar-width:thin}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h2{font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

/* Map */
.map-wrap{margin-top:10px;position:relative}
#map{width:100%;height:auto;display:block;touch-action:manipulation}
#map .sec{cursor:pointer}
#map .sec path{stroke-linejoin:round;transition:opacity .15s}
#map .sec:hover path{filter:brightness(1.1)}
#map .sec:focus{outline:none}
#map .sec:focus-visible path.hl{stroke:var(--text);stroke-width:1.6}
#map text{font-family:var(--font-mono);font-size:3.1px;fill:#fff;pointer-events:none;font-weight:500}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px}
.legend div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);min-width:0}
.legend b{font-weight:600;color:var(--text);font-family:var(--font-mono);font-size:11.5px;margin-left:auto}
.sw{width:11px;height:11px;border-radius:3px;flex:none}

/* Section card */
.sec-top{display:flex;align-items:center;gap:12px}
.sec-id{font-family:var(--font-display);font-weight:750;font-size:30px;line-height:1;letter-spacing:-.02em;min-width:64px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--ok);border-radius:inherit}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1}

/* Row/seat */
.field{display:flex;align-items:center;gap:10px;margin-top:10px}
.field label{font-size:12.5px;color:var(--muted);min-width:42px}
.select{flex:1;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;min-width:0}
.strip{display:flex;gap:4px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:thin;min-width:0}
.strip button{flex:none;width:30px;height:30px;border-radius:7px 7px 9px 9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--font-mono);font-size:11px;padding:0}
.strip button.av{border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.strip button.sold{background:var(--surface-3);color:var(--muted);text-decoration:line-through;border-style:dashed}
.strip button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--text);font-weight:600;text-decoration:none}
.mini-legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.mini-legend span{display:inline-flex;align-items:center;gap:5px}
.powered{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0 6px}
.powered b{font-weight:600;color:var(--text)}

/* Stage */
.stage{position:relative;min-height:0;min-width:0;border-radius:var(--r);overflow:hidden;background:var(--scene-bg);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
.stage canvas:active{cursor:grabbing}
.ov{position:absolute;z-index:2}
.chip{top:12px;left:12px;max-width:calc(100% - 150px);background:var(--overlay);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.5px;display:flex;align-items:center;gap:8px;min-width:0}
.chip strong{font-family:var(--font-display);font-weight:650;font-size:13.5px;white-space:nowrap}
.chip span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{top:12px;right:12px;display:flex;gap:6px}
.tr .btn{background:var(--overlay);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hint{left:50%;transform:translateX(-50%);bottom:118px;background:var(--scrim);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.seatbar{left:12px;right:12px;bottom:12px;background:var(--overlay);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;box-shadow:var(--shadow)}
.sb-title{font-family:var(--font-display);font-weight:650;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px}
.sb-meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.sb-nav{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:16px;height:16px}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.warn-chip{display:inline-flex;align-items:center;gap:5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 7px;font-weight:600;font-size:12px}
.warn-chip svg{width:12px;height:12px}
.sb-reason{color:var(--warn);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip button.obs{position:relative}
.strip button.obs::after{content:"";position:absolute;right:2px;top:2px;width:0;height:0;border-left:6px solid transparent;border-top:6px solid var(--warn)}
.loading{left:50%;top:50%;transform:translate(-50%,-50%);background:var(--overlay);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:220px;font-size:13px;box-shadow:var(--shadow)}
.loading .bar{margin-top:8px}
.loading .bar span{background:var(--brand);transition:width .15s}
.venue-list{display:flex;flex-direction:column;gap:6px}
.venue-list button{display:block;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.venue-list button[aria-pressed="true"]{border-color:var(--text);font-weight:600}
.venue-list small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
html.embed .top{display:none}
html.embed .app{grid-template-rows:minmax(0,1fr)}
@media (min-width: 761px){ html.embed .main{grid-template-columns:minmax(260px,300px) minmax(0,1fr)} html.embed .app{padding-block:10px} }
.cmp-lab{position:absolute;z-index:2;display:none;align-items:center;gap:6px;background:var(--overlay);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;white-space:nowrap;max-width:calc(50% - 20px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.cmp-lab small{font-weight:500;font-size:10.5px;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:0 5px}
.cmp-lab i{width:8px;height:8px;border-radius:2px;flex:none}
.cmp-div{position:absolute;z-index:2;display:none;background:var(--line-strong);pointer-events:none}
.stage.cmp .cmp-lab,.stage.cmp .cmp-div{display:flex}
.stage.cmp:not(.stack) .chip{max-width:calc(50% - 24px)}
@media (max-width: 760px){ .main:has(.stage.cmp.stack){grid-template-rows:minmax(520px,72%) minmax(0,1fr)} .stage.cmp.stack .seatbar .sb-meta span:nth-child(n+3){display:none} }
.stage.cmp #cmpL{left:12px;top:56px} .stage.cmp #cmpR{left:calc(50% + 12px);top:56px}
.stage.cmp .cmp-div{left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px)}
.stage.cmp.stack #cmpL{left:8px;top:50px;max-width:calc(100% - 16px)} .stage.cmp.stack #cmpR{left:8px;top:calc(50% + 8px);max-width:calc(100% - 16px)}
.stage.cmp.stack .cmp-div{left:0;right:0;top:50%;bottom:auto;width:auto;height:2px;transform:translateY(-1px)}
.cmp-row{display:flex;gap:6px}
.cmp-row .btn{flex:1}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}

/* Drawer + popover */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);
  transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:18px;flex:1}
.dr-body{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px 16px;display:flex;flex-direction:column;gap:16px}
.dr-body p{margin:0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi small{display:block;color:var(--muted);font-size:11.5px}
.kpi b{font-family:var(--font-display);font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.h3{font-family:var(--font-display);font-size:13.5px;font-weight:650;margin-bottom:6px}
.tops div{display:grid;grid-template-columns:42px 1fr 28px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:4px}
.tops i{display:block;height:8px;border-radius:4px;background:var(--brand)}
.tops b{font-family:var(--font-mono);font-weight:500;text-align:right}
.log{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto}
.log > div{padding:6px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px}
.log > div > div span{display:block}
.log > div:last-child{border-bottom:0}
.log em{font-style:normal;color:var(--brand);font-weight:500}
:root[data-theme="dark"] .log em{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .log em{color:var(--accent)}}
.log span{color:var(--muted);word-break:break-all}
.defs{display:flex;flex-direction:column;gap:8px}
.defs div{font-size:12.5px}
.defs code{font-family:var(--font-mono);font-size:12px;background:var(--surface-3);padding:1px 6px;border-radius:5px}
.defs span{color:var(--muted);display:block;margin-top:2px}
.empty{color:var(--muted);font-size:12.5px;padding:10px}

.pop{position:fixed;z-index:21;top:62px;right:max(16px,env(safe-area-inset-right,0px));width:min(320px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:none;flex-direction:column;gap:12px}
.pop.on{display:flex}
.pop label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.pop .seg{width:100%}
.pop .seg button{flex:1}
.brand-list{display:flex;flex-direction:column;gap:6px}
.brand-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:left}
.brand-opt[aria-pressed="true"]{border-color:var(--text)}
.brand-opt .bl{width:28px;height:20px;border-radius:5px;flex:none;position:relative}
.brand-opt .bl::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:2px;background:var(--a)}

.toast{position:fixed;z-index:30;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(520px,calc(100% - 32px));transition:all .25s;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast code{font-family:var(--font-mono);font-size:12px;opacity:.8}

@media (max-width: 1080px){ .only-wide{display:none} }
@media (max-width: 760px){
  body{font-size:13.5px}
  .app{gap:10px;padding-block:10px}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(300px,52%) minmax(0,1fr);gap:10px}
  .stage{order:-1}
  .top{flex-wrap:wrap;row-gap:6px}
  .event{order:3;flex-basis:100%}
  .event p{display:none}
  .event h1{font-size:14.5px}
  .top .spacer{display:block}
  .logo{height:32px;padding:0 9px;font-size:13px}
  .btn{height:34px;padding:0 10px}
  .hide-sm{display:none}
  .seatbar{grid-template-columns:auto minmax(0,1fr);gap:8px 8px;padding:9px 10px;left:8px;right:8px;bottom:8px}
  .seatbar > :first-child{grid-column:1 / -1}
  .seatbar.compact{grid-template-columns:minmax(0,1fr) auto}
  .seatbar.compact > :first-child{grid-column:auto}
  .seatbar .sb-cta .btn{width:100%}
  .sb-title{font-size:15px}
  .sb-meta{font-size:12px;gap:4px 9px}
  .icon-btn{width:34px;height:34px}
  .hint{bottom:118px}
  .chip{left:8px;top:8px;max-width:calc(100% - 132px)}
  .tr{right:8px;top:8px}
  .pop{top:54px}
  /* Gömülüyken telefonda tek kaydırma: içerik doğal yüksekliğinde akar, host iframe'i koltuk:resize ile büyütür. */
  html.embed, html.embed body{height:auto}
  html.embed body{overflow:visible}
  html.embed .app{height:auto}
  html.embed .main{grid-template-rows:420px auto}
  html.embed .side{overflow:visible}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
</style>

<div class="app" id="app">
  <header class="top">
    <span class="logo" id="logo"><i></i><span id="logoText">BİLETRA</span></span>
    <div class="event">
      <h1 id="evTitle">Kartallar – Yıldızlar</h1>
      <p id="evMeta">Basketbol · Örnek Arena · 14 Kasım 2026 Cmt, 20:30</p>
    </div>

/* =====================================================================
   3) DEMO VERİSİ — venue.json şemasına (v0.2) uygun nesne üretir.
   Görüntüleyici YALNIZCA bu nesneyi okur. Gerçek mekânda bu nesne
   3D ekibinin ürettiği venue.json'dan gelir: loadVenue(obj).
   v0.2: eye.y = basamak zemini + 1,15 m; koltuk 1 = izleyicinin solu.
   ===================================================================== */
const EYE_H = 1.15;  // v0.2 §2: basamak zemini + 1,15 m
function generateDemoVenue(){
  const params = {
    court:[28,15], core:[15,8.5], roofHeight:27, seatPitch:0.52, aisle:1.1,
    tiers:[
      { tier:'lower', d0:3.0,  rows:14, depth:0.85, h0:0.5, riser:0.42 },
      { tier:'upper', d0:17.9, rows:17, depth:0.90, h0:9.4, riser:0.58 }
    ]
  };
  const H=1/3, T=2/3;
  const defs = [
    // [tierIndex, segment, f0, f1, priceCategory]
    [0,0,0,1,'CAT3'],[0,1,0,1,'CAT3'],[0,2,0,H,'CAT2'],[0,2,H,T,'CAT1'],[0,2,T,1,'CAT2'],[0,3,0,1,'CAT3'],
    [0,4,0,1,'CAT3'],[0,5,0,1,'CAT3'],[0,6,0,H,'CAT2'],[0,6,H,T,'CAT1'],[0,6,T,1,'CAT2'],[0,7,0,1,'CAT3'],
    [1,0,0,1,'CAT5'],[1,1,0,.5,'CAT5'],[1,1,.5,1,'CAT5'],[1,2,0,H,'CAT4'],[1,2,H,T,'CAT4'],[1,2,T,1,'CAT4'],[1,3,0,.5,'CAT5'],[1,3,.5,1,'CAT5'],
    [1,4,0,1,'CAT5'],[1,5,0,.5,'CAT5'],[1,5,.5,1,'CAT5'],[1,6,0,H,'CAT4'],[1,6,H,T,'CAT4'],[1,6,T,1,'CAT4'],[1,7,0,.5,'CAT5'],[1,7,.5,1,'CAT5']
  ];
  const focus=[0,1.0,0];
  const r2=v=>Math.round(v*100)/100;
  const counters=[100,200];
  const sections=[], viewpoints=[]; let capacity=0;
  for(const [ti,seg,f0,f1,cat] of defs){
    const tier=params.tiers[ti];
    const id=String(++counters[ti]);
    const sec={ id, name:(ti===0?'Alt Kat ':'Üst Kat ')+id, tier:tier.tier, priceCategory:cat, rows:[] };
    for(let r=0;r<tier.rows;r++){
      const d=tier.d0+r*tier.depth, h=tier.h0+r*tier.riser, dEye=d+0.42;
      const len=segLength(params.core,seg,dEye)*(f1-f0);
      const n=Math.max(0,Math.floor((len-params.aisle)/params.seatPitch));
      const pad=(len-n*params.seatPitch)/2;
      const row={ id:String(r+1), seats:[] };
      // Parametre f arttıkça izleyicinin SOLUNA gidilir; koltuk 1 = sol uç (3D ekibi verisiyle aynı yön)
      for(let i=n-1;i>=0;i--){
        const f=f0+((pad+(i+.5)*params.seatPitch)/len)*(f1-f0);
        const p=curvePoint(params.core,seg,f,dEye);
        const sid=String(n-i);
        row.seats.push({ id:sid, ticketCode:id+'-'+row.id+'-'+sid, eye:[r2(p.x), r2(h+EYE_H), r2(p.z)] });
      }
      capacity+=n; sec.rows.push(row);
    }
    sections.push(sec);
    const vr=sec.rows[Math.floor(sec.rows.length*.35)], vs=vr.seats[Math.floor(vr.seats.length/2)];
    if(vs) viewpoints.push({ id:'vp-'+id+'-mid', sectionId:id, row:vr.id, seat:vs.id, eye:vs.eye.slice(), lookAt:focus.slice(), capture:null });
  }
  return {
    schemaVersion:'0.2',
    'x-categories':{
      CAT1:{ tr:'Kategori 1 · Saha kenarı', en:'Category 1 · Courtside' },
      CAT2:{ tr:'Kategori 2 · Alt kat orta', en:'Category 2 · Lower centre' },
      CAT3:{ tr:'Kategori 3 · Alt kat köşe', en:'Category 3 · Lower corner' },
      CAT4:{ tr:'Kategori 4 · Üst kat orta', en:'Category 4 · Upper centre' },
      CAT5:{ tr:'Kategori 5 · Üst kat', en:'Category 5 · Upper' }
    },
    venue:{ id:'ornek-arena', name:'Örnek Arena', type:'arena', capacity, origin:'field-center', focus,
      scene:{ kind:'procedural', url:null, transform:{ position:[0,0,0], rotationY:0, scale:1 }, params } },
    sections, viewpoints
  };
}
/* Yuvarlatılmış dikdörtgen kase: 0,2,4,6 düz kenar; 1,3,5,7 köşe yayları. d = çekirdek dikdörtgenden uzaklık. */
function segLength(core,seg,d){ return seg%2===0 ? (seg%4===0 ? 2*core[1] : 2*core[0]) : Math.PI/2*d; }
function curvePoint(core,seg,f,d){
  const cx=core[0], cz=core[1];
  const arc=(ox,oz,a0)=>{ const a=a0+f*Math.PI/2; return {x:ox+d*Math.cos(a), z:oz+d*Math.sin(a), nx:Math.cos(a), nz:Math.sin(a)}; };
  switch(seg){
    case 0: return {x:cx+d, z:-cz+2*cz*f, nx:1, nz:0};
    case 1: return arc(cx,cz,0);
    case 2: return {x:cx-2*cx*f, z:cz+d, nx:0, nz:1};
    case 3: return arc(-cx,cz,Math.PI/2);
    case 4: return {x:-cx-d, z:cz-2*cz*f, nx:-1, nz:0};
    case 5: return arc(-cx,-cz,Math.PI);
    case 6: return {x:-cx+2*cx*f, z:-cz-d, nx:0, nz:-1};
    default: return arc(cx,-cz,Math.PI*1.5);
  }
}

/* =====================================================================
   4) SAHNE ADAPTÖRLERİ
   SceneAdapter: görüntüleyici çekirdeği (kamera, UI, analitik) sahnenin
   NASIL çizildiğini bilmez. ProceduralScene ve SplatScene aynı arayüzü uygular.

class SceneAdapter {
  constructor(scene){ this.scene=scene; }
  /** venue nesnesinden sahneyi kur */ build(venue, ctx){}
  /** tema token'ları değişti */ setTheme(tokens){}

      m.compose(v,q,sc); mesh.setMatrixAt(i,m); mesh.setColorAt(i,white); m.toArray(this._seatMatrices,i*16);

    const ball=new THREE.Mesh(new THREE.SphereGeometry(0.6,16,12),this.markerMat); ball.position.y=1.5; g.add(ball);
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.24,12,8),new THREE.MeshBasicMaterial({color:0x13171a})); dot.position.set(0,1.5,0); g.add(dot);

  setTheme(t){

  setSeatMarker(rec, hide){
    if(!rec){ this.marker.visible=false; return; }
    this.marker.position.set(rec.eye[0],rec.eye[1]-0.6,rec.eye[2]);

  }
  pick(ray){

    const objs=[this.seatMesh]; if(this.shell) objs.push(this.shell); if(this.treads) objs.push(this.treads);
    const hits=ray.intersectObjects(objs,false); if(!hits.length) return -1;
    const h=hits[0]; if(h.object===this.seatMesh || h.object===this.treads) return h.instanceId;

    return best;
  }
}

/* =====================================================================
   SplatScene — 3D Gaussian Splatting (.splat, 32 bayt/gauss) görüntüleyici.
   Harici kütüphane yok: three r128 üzerinde minimal çizici.
   - Veri: konum + 3B kovaryans + renk → 3 adet RGBA32F doku (GPU'da sabit).
   - Her kare: kamera değiştiyse CPU'da 16 bit sayma sıralaması (arkadan öne),
     yalnızca sıralı indeks dizisi (instanced attribute) yüklenir.
   - Vertex shader'da EWA projeksiyonu (J·W·Σ·Wᵀ·Jᵀ), ön-çarpımlı alfa karışımı.
   - Koltuklar görünmez çarpışma geometrisi olarak kalır: pick/işaretçi/kamera aynı.
   Biçim: [x,y,z f32][sx,sy,sz f32 doğrusal ölçek][r,g,b,a u8][qw,qx,qy,qz u8 (q*128+128)]
   ===================================================================== */
const SPLAT_VS=`
attribute float splatIndex;
uniform sampler2D texA; uniform sampler2D texB; uniform sampler2D texC;
uniform vec2 texSize; uniform vec2 viewport; uniform vec2 focal; uniform float clipY;
varying vec4 vColor; varying vec2 vPos;
mat3 tr3(mat3 m){ return mat3(m[0][0],m[1][0],m[2][0], m[0][1],m[1][1],m[2][1], m[0][2],m[1][2],m[2][2]); }
void main(){
  float row=floor(splatIndex/texSize.x);
  vec2 uv=vec2((splatIndex-row*texSize.x+0.5)/texSize.x,(row+0.5)/texSize.y);
  vec4 a=texture2D(texA,uv); vec4 b=texture2D(texB,uv); vec4 c=texture2D(texC,uv);
  if(a.y>clipY){ gl_Position=vec4(0.0,0.0,2.0,1.0); return; } // genel bakışta çatıyı kes
  vec4 cam=modelViewMatrix*vec4(a.xyz,1.0);
  vec4 clip=projectionMatrix*cam;
  float lim=1.25*clip.w;
  if(cam.z>-0.25 || clip.x<-lim || clip.x>lim || clip.y<-lim || clip.y>lim){ gl_Position=vec4(0.0,0.0,2.0,1.0); return; }
  mat3 Vrk=mat3(a.w,b.x,b.y, b.x,b.z,b.w, b.y,b.w,c.x);
  float tz=-cam.z;
  mat3 J=mat3(focal.x/tz,0.0,0.0, 0.0,focal.y/tz,0.0, focal.x*cam.x/(tz*tz),focal.y*cam.y/(tz*tz),0.0);
  mat3 T=J*mat3(modelViewMatrix);
  mat3 cov=T*Vrk*tr3(T);
  float A=cov[0][0]+0.3, B=cov[0][1], C=cov[1][1]+0.3;
  float mid=0.5*(A+C), rad=length(vec2(0.5*(A-C),B));
  float l1=mid+rad, l2=max(mid-rad,0.1);
  vec2 dv=abs(B)<1e-6 ? (A>=C?vec2(1.0,0.0):vec2(0.0,1.0)) : normalize(vec2(B,l1-A));
  vec2 major=min(sqrt(l1),512.0)*dv, minor=min(sqrt(l2),512.0)*vec2(dv.y,-dv.x);
  vPos=position.xy;
  vColor=vec4(floor(c.y/256.0)/255.0, mod(c.y,256.0)/255.0, floor(c.z/256.0)/255.0, mod(c.z,256.0)/255.0);
  vec2 ndc=clip.xy/clip.w + (position.x*major+position.y*minor)*2.0/viewport;
  gl_Position=vec4(ndc, clip.z/clip.w, 1.0);
}`;
const SPLAT_FS=`
varying vec4 vColor; varying vec2 vPos;
void main(){ float d=dot(vPos,vPos); if(d>6.25) discard; float a=exp(-0.5*d)*vColor.a; if(a<0.004) discard; gl_FragColor=vec4(vColor.rgb*a,a); }`;

class SplatMesh {
  constructor(buf){

      let qw=(u[32*i+28]-128)/128, qx=(u[32*i+29]-128)/128, qy=(u[32*i+30]-128)/128, qz=(u[32*i+31]-128)/128;
      const qn=Math.hypot(qw,qx,qy,qz)||1; qw/=qn; qx/=qn; qy/=qn; qz/=qn;
      const r00=1-2*(qy*qy+qz*qz), r01=2*(qx*qy-qw*qz), r02=2*(qx*qz+qw*qy);
      const r10=2*(qx*qy+qw*qz), r11=1-2*(qx*qx+qz*qz), r12=2*(qy*qz-qw*qx);
      const r20=2*(qx*qz-qw*qy), r21=2*(qy*qz+qw*qx), r22=1-2*(qx*qx+qy*qy);
      const m00=r00*sx, m01=r01*sy, m02=r02*sz, m10=r10*sx, m11=r11*sy, m12=r12*sz, m20=r20*sx, m21=r21*sy, m22=r22*sz;
      const o=4*i;
      A[o]=x; A[o+1]=y; A[o+2]=z; A[o+3]=m00*m00+m01*m01+m02*m02;
      B[o]=m00*m10+m01*m11+m02*m12; B[o+1]=m00*m20+m01*m21+m02*m22; B[o+2]=m10*m10+m11*m11+m12*m12; B[o+3]=m10*m20+m11*m21+m12*m22;
      C[o]=m20*m20+m21*m21+m22*m22; C[o+1]=u[32*i+24]*256+u[32*i+25]; C[o+2]=u[32*i+26]*256+u[32*i+27];
      this.pos[3*i]=x; this.pos[3*i+1]=y; this.pos[3*i+2]=z;
    }
    const tex=d=>{ const t=new THREE.DataTexture(d,W,H,THREE.RGBAFormat,THREE.FloatType); t.minFilter=t.magFilter=THREE.NearestFilter; t.generateMipmaps=false; t.needsUpdate=true; return t; };
    const g=new THREE.InstancedBufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-2.5,-2.5,0, 2.5,-2.5,0, 2.5,2.5,0, -2.5,2.5,0]),3));
    g.setIndex([0,1,2,0,2,3]);
    this.order=new Float32Array(N); for(let i=0;i<N;i++) this.order[i]=i;
    this.orderAttr=new THREE.InstancedBufferAttribute(this.order,1); this.orderAttr.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('splatIndex',this.orderAttr); g.instanceCount=N;
    this.uniforms={ texA:{value:tex(A)}, texB:{value:tex(B)}, texC:{value:tex(C)}, texSize:{value:new THREE.Vector2(W,H)},
      viewport:{value:new THREE.Vector2(1,1)}, focal:{value:new THREE.Vector2(1,1)}, clipY:{value:1e9} };
    const mat=new THREE.ShaderMaterial({ uniforms:this.uniforms, vertexShader:SPLAT_VS, fragmentShader:SPLAT_FS, transparent:true, depthWrite:false, depthTest:true, side:THREE.DoubleSide,
      blending:THREE.CustomBlending, blendSrc:THREE.OneFactor, blendDst:THREE.OneMinusSrcAlphaFactor, blendSrcAlpha:THREE.OneFactor, blendDstAlpha:THREE.OneMinusSrcAlphaFactor });
    this.mesh=new THREE.Mesh(g,mat); this.mesh.frustumCulled=false; this.mesh.renderOrder=10;
    this.counts=new Uint32Array(65536); this.keys=new Uint16Array(N); this.depth=new Float32Array(N);
    this._last=new Float32Array(16); this._mv=new THREE.Matrix4(); this.sortMs=0; this.sorts=0;
  }
  update(camera, renderer){
    const vp=renderer.getCurrentViewport(this._vp||(this._vp=new THREE.Vector4())); const sz=new THREE.Vector2(vp.z,vp.w); const P=camera.projectionMatrix.elements;
    this.uniforms.viewport.value.copy(sz); this.uniforms.focal.value.set(P[0]*sz.x/2, P[5]*sz.y/2);
    this.mesh.updateMatrixWorld(); this._mv.multiplyMatrices(camera.matrixWorldInverse,this.mesh.matrixWorld);
    const e=this._mv.elements; let diff=0; for(let k=0;k<16;k++) diff+=Math.abs(e[k]-this._last[k]);
    if(diff<1e-4) return; this._last.set(e); this.sort(e);
  }
  sort(e){
    const t0=performance.now(), N=this.N, p=this.pos, d=this.depth, m2=e[2], m6=e[6], m10=e[10];
    let mn=Infinity, mx=-Infinity;
    for(let i=0;i<N;i++){ const z=m2*p[3*i]+m6*p[3*i+1]+m10*p[3*i+2]; d[i]=z; if(z<mn) mn=z; if(z>mx) mx=z; }
    const sc=65535/Math.max(1e-6,mx-mn), cnt=this.counts, keys=this.keys; cnt.fill(0);
    for(let i=0;i<N;i++){ const k=((d[i]-mn)*sc)|0; keys[i]=k; cnt[k]++; }      // küçük z (uzak) önce
    for(let k=1;k<65536;k++) cnt[k]+=cnt[k-1];
    const o=this.order; for(let i=N-1;i>=0;i--) o[--cnt[keys[i]]]=i;
    this.orderAttr.needsUpdate=true; this.sortMs=performance.now()-t0; this.sorts++;
  }
}
async function fetchBuffer(url, onProgress){
  const res=await fetch(url); if(!res.ok) throw new Error('HTTP '+res.status+' '+url);
  // Artifact barındırması ikili .splat sunmuyor; .b64.txt = base64 metin olarak paketlenmiş splat.
  if(/\.b64\.txt$/i.test(url)){ const t=(await res.text()).trim(); const bin=atob(t); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); onProgress&&onProgress(1); return out.buffer; }
  const total=+res.headers.get('content-length')||0;
  if(!res.body || !total){ const b=await res.arrayBuffer(); onProgress&&onProgress(1); return b; }
  const reader=res.body.getReader(), out=new Uint8Array(total); let got=0;
  for(;;){ const {done,value}=await reader.read(); if(done) break; out.set(value,got); got+=value.length; onProgress&&onProgress(got/total); }
  return out.buffer;
}
class SplatScene extends ProceduralScene {
  build(venue, ctx){
    this.ctx=ctx; this.venue=venue; this.params=null; const vs=venue.venue.scene||{};
    this.initRoots(vs); this.buildSeats(ctx.seats); this.buildMarker();
    const fmt=(vs.format||'').toLowerCase();
    // v0.2 §3.2: files varsa en kaba LOD (en büyük lod) önce; bu sürüm yalnız tek .splat dosyası yükler.
    let entry=null;
    if(Array.isArray(vs.files) && vs.files.length){ entry=vs.files.filter(f=>!f.format||f.format==='splat').sort((a,b)=>(b.lod||0)-(a.lod||0))[0]; }
    const url=entry? entry.url : vs.url;
    if(!url || (fmt && fmt!=='splat' && !entry)){ this.fail(new Error('desteklenmeyen sahne biçimi: '+(fmt||'?'))); return; }
    const abs=new URL(url, ctx.baseUrl||document.baseURI).href;
    this.loading=true; ctx.onProgress(0);
    const t0=performance.now();
    fetchBuffer(abs, p=>ctx.onProgress(p)).then(buf=>{
      if(this.disposed) return;
      const t1=performance.now();
      this.splat=new SplatMesh(buf); this.shellRoot.add(this.splat.mesh);
      this.stats={ count:this.splat.N, bytes:buf.byteLength, downloadMs:Math.round(t1-t0), parseMs:Math.round(performance.now()-t1) };
      this.loading=false; ctx.onLoaded(this.stats); ctx.requestPaint();
    }).catch(err=>this.fail(err));
  }
  fail(err){
    if(this.disposed) return;
    console.warn('SplatScene:',err.message,'→ koltuklardan türetilen kabuk');
    this.loading=false; this.failed=true;
    this.buildAutoShell(this.venue,this.ctx.seats); this.ctx.onError(err); this.ctx.requestPaint();
  }
  dispose(){ this.disposed=true; super.dispose(); }
  update(camera, renderer){
    if(!this.splat) return;
    // Genel bakışta kamera tavanın üstünde: en üst koltuğun 3 m üstünü aşan gaussları (çatı, skorbord askıları) gizle.
    if(this._topY===undefined){ let t=-Infinity; for(const st of this.ctx.seats) if(st.eye[1]>t) t=st.eye[1]; this._topY=t; }
    const sc=this.splat.mesh.matrixWorld.getMaxScaleOnAxis()||1, oy=this.splat.mesh.matrixWorld.elements[13];
    this.splat.uniforms.clipY.value = this.ctx.getMode()==='overview' ? (this._topY+3-oy)/sc : 1e9;
    this.splat.update(camera, renderer);
  }
  setTheme(t){ super.setTheme(t); }
  /* Splat yüklüyken koltuk modelleri gizlenir; genel bakışta yalnız seçili bloğun koltukları vurgu olarak gösterilir. */
  paintSeats(fn){
    super.paintSeats(fn);
    if(!this.splat){ this.seatMesh.visible=true; return; }
    const sel=this.ctx.getSectionId(), mode=this.ctx.getMode(), m=this.seatMesh, seats=this.ctx.seats;
    const Z=new THREE.Matrix4().makeScale(0,0,0), M=new THREE.Matrix4();
    for(let i=0;i<m.count;i++){ if(mode==='overview' && seats[i].sectionId===sel) { M.fromArray(this._seatMatrices,i*16); m.setMatrixAt(i,M); } else m.setMatrixAt(i,Z); }
    m.instanceMatrix.needsUpdate=true; m.visible=mode==='overview';
  }
  pick(ray){
    if(!this.splat) return super.pick(ray);
    // Işına en yakın koltuk (çarpışma geometrisi yerine): splat'te basamak yüzeyi yok.
    const seats=this.ctx.seats, r=ray.ray, v=new THREE.Vector3(); let best=-1, bs=Infinity;
    for(let i=0;i<seats.length;i++){ const e=seats[i].eye; v.set(e[0],e[1]-EYE_H+0.5,e[2]);
      const t=v.clone().sub(r.origin).dot(r.direction); if(t<0.5) continue;
      const d2=r.distanceSqToPoint(v), lim=Math.max(0.45,t*0.012); if(d2<lim*lim){ const s=t+d2*4; if(s<bs){ bs=s; best=i; } } }
    return best;
  }
}

const S = {
  venue:null, compare:false, venueOpt:'demo', baseUrl:null, seats:[], byCode:new Map(), sections:new Map(),
  sectionId:null, rowId:null, seatIdx:-1, mode:'overview', bounds:null,
  lang:'tr', themePref:'auto', events:[], viewStart:null, hintShown:false

const SESSION_ID = 'demo-'+Math.random().toString(36).slice(2,8);
/* Gömme: üst pencere (host) yalnızca izin listesindeki origin'lerden komut gönderebilir; olaylar yalnız bu origin'e gider.
   Üretimde liste müşteri yapılandırmasından (sunucu tarafı) gelir; URL parametresine güvenilmez. */
const QS = new URLSearchParams(location.search);
const EMBED = QS.get('embed')==='1';
/* İzin listesi: üretimde müşteri kaydından sunucu tarafında doldurulur. Demo: yalnız aynı origin (host sayfa ile görüntüleyici birlikte yayınlanır). */
const EMBED_ALLOWED_ORIGINS = [location.origin].filter(o=>o && o!=='null');
/* Kanal kimliği: embed.js iframe URL'sinin #ch= parçasıyla verir; her mesajda taşınır. Aynı sayfada birden çok görüntüleyiciyi ayırır. */
const EMBED_CHANNEL = (location.hash.match(/[#&]ch=([A-Za-z0-9_-]{6,64})/)||[])[1]||null;
/* Opak origin ('null'): sandbox'lı iframe içinde yayınlanan sayfalarda origin karşılaştırılamaz. Bu durumda yalnız
   e.source===window.parent VE kanal kimliği eşleşen mesajlar kabul edilir; giden mesajlar '*' ile gider ve yalnız
   kanal kimliğiyle ilişkilendirilir (kişisel veri taşımaz: koltuk kodu, fiyat, olay adı). */
const OPAQUE = location.origin==='null';
function parentOrigin(){ if(OPAQUE) return EMBED_CHANNEL?'*':null; try{ const r=document.referrer && new URL(document.referrer).origin; if(r && EMBED_ALLOWED_ORIGINS.includes(r)) return r; }catch(e){} return EMBED_ALLOWED_ORIGINS[0]||null; }
function postToHost(msg){ try{ const o=parentOrigin(); if(o && window.parent && window.parent!==window) window.parent.postMessage(Object.assign({channel:EMBED_CHANNEL},msg),o); }catch(e){} }
function hostMessageAllowed(e){
  if(window.parent===window || e.source!==window.parent) return false;
  const m=e.data; if(!m || typeof m!=='object' || typeof m.type!=='string' || m.type.indexOf('koltuk:')!==0) return false;
  if(EMBED_CHANNEL && m.channel!==EMBED_CHANNEL) return false;
  if(OPAQUE) return !!EMBED_CHANNEL && (e.origin==='null' || EMBED_ALLOWED_ORIGINS.includes(e.origin));
  return EMBED_ALLOWED_ORIGINS.includes(e.origin);
}
function track(name, props){

  S.events.push(ev);
  try{ window.dispatchEvent(new CustomEvent('koltuk:analytics',{detail:ev})); }catch(e){}
  postToHost({type:'koltuk:event', event:ev});
  if(drawerOpen) renderAnalytics();
}
function endSeatView(){

}

   6) loadVenue — dış venue.json girişi (v0.1 ve v0.2)
   ===================================================================== */
function validateVenue(o){
  if(!o || typeof o!=='object') throw new Error('nesne değil');
  if(!['0.1','0.2'].includes(String(o.schemaVersion))) throw new Error('schemaVersion desteklenmiyor: '+o.schemaVersion);
  if(!o.venue || !Array.isArray(o.venue.focus) || o.venue.focus.length!==3) throw new Error('venue.focus eksik');
  if(!Array.isArray(o.sections) || !o.sections.length) throw new Error('sections boş');
  const T=o.venue.scene&&o.venue.scene.transform; if(T&&Array.isArray(T.rotation)&&Math.abs(Math.hypot(...T.rotation)-1)>0.001) throw new Error('rotation birim kuaterniyon değil');
  const codes=new Set();
  for(const s of o.sections){ if(!s.id || !Array.isArray(s.rows)) throw new Error('blok '+(s.id||'?')+' hatalı');
    for(const r of s.rows) for(const k of r.seats){
      if(!Array.isArray(k.eye)||k.eye.length!==3||k.eye.some(v=>typeof v!=='number'||!isFinite(v))) throw new Error('koltuk '+(k.ticketCode||k.id)+' eye hatalı');
      const c=k.ticketCode||(s.id+'-'+r.id+'-'+k.id); if(codes.has(c)) throw new Error('yinelenen ticketCode '+c); codes.add(c); } }
}
function normObstructed(o){ if(!o) return null; if(o===true) return {severity:'partial', reason:''}; return { severity:o.severity==='severe'?'severe':'partial', reason:o.reason||'' }; }
function loadVenue(obj, opts){
  opts=opts||{};
  try{ validateVenue(obj); }catch(e){ toast(t('errVenue').replace('{m}',e.message)); console.error(e); return false; }
  endSeatView();
  S.venue=obj; S.baseUrl=opts.baseUrl||null; S.venueOpt=opts.optId||S.venueOpt; S.seats=[]; S.byCode.clear(); S.sections.clear();
  const vf=obj.venue.focus;
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity,maxY=-Infinity;
  obj.sections.forEach(sec=>{
    const info={ sec, seatIdx:[], rows:new Map(), total:0, avail:0, obstructed:0 };
    sec.rows.forEach((row,ri)=>{
      const idxs=[];
      row.seats.forEach((seat,si)=>{
        const code=seat.ticketCode || (sec.id+'-'+row.id+'-'+seat.id);
        const look=seat.lookAt || sec.focus || vf;
        const sold=TicketAPI.isSold(code, sec.priceCategory);
        const obs=normObstructed(seat.obstructed);
        const rec={ i:S.seats.length, code, sectionId:sec.id, rowId:row.id, seatId:seat.id, ri, si, eye:seat.eye, look, cat:sec.priceCategory, sold, obs };
        S.seats.push(rec); S.byCode.set(code,rec); idxs.push(rec.i); info.seatIdx.push(rec.i);
        info.total++; if(!sold) info.avail++; if(obs) info.obstructed++;
        const e=seat.eye; if(e[0]<minX)minX=e[0]; if(e[0]>maxX)maxX=e[0]; if(e[2]<minZ)minZ=e[2]; if(e[2]>maxZ)maxZ=e[2]; if(e[1]>maxY)maxY=e[1];
      });
      info.rows.set(row.id,idxs);
    });
    S.sections.set(sec.id,info);
  });
  const cx=(minX+maxX)/2, cz=(minZ+maxZ)/2;
  S.bounds={ cx, cz, R:Math.max(8,Math.hypot((maxX-minX)/2,(maxZ-minZ)/2)), maxY };
  S.sectionId=null; S.rowId=null; S.seatIdx=-1; S.mode='overview';
  if(GL.ok) GL.rebuild();
  renderMap(); renderLegend(); renderEventHead();
  document.getElementById('capacityLbl').textContent=t('capacity').replace('{n}',fmtInt(S.seats.length));
  const all=[...S.sections.values()];
  const first=all.find(x=>x.sec.priceCategory==='CAT1') || all[0];
  selectSection(first.sec.id,{source:'init', silent:true});
  goOverview(true);
  if(opts.optId) save();
  postToHost({type:'koltuk:venueLoaded', venueId:obj.venue.id, venueOpt:S.venueOpt, name:obj.venue.name, venueType:obj.venue.type, seats:S.seats.length, sections:S.sections.size});
  return true;
}
async function selectVenueOption(id){
  const o=VENUE_OPTIONS.find(x=>x.id===id)||VENUE_OPTIONS[0];
  if(o.url){
    const abs=new URL(o.url, document.baseURI).href;
    showLoading(t('loadingVenue'),0);
    try{ const res=await fetch(abs); if(!res.ok) throw new Error('HTTP '+res.status); const json=await res.json(); hideLoading();
      return loadVenue(json,{baseUrl:abs, optId:o.id}); }
    catch(e){ hideLoading(); toast(t('errVenue').replace('{m}',(e.message||'')+' · '+o.url)); console.error(e); if(!S.venue) loadVenue(generateDemoVenue(),{optId:'demo'}); return false; }
  }
  return loadVenue(o.load(),{optId:o.id, baseUrl:document.baseURI});
}

  }
};

function selectSection(id,{source='map', silent=false}={}){
  const info=S.sections.get(id); if(!info) return;
  const changed=S.sectionId!==id;
  S.sectionId=id;
  if(changed){ S.rowId=info.sec.rows[Math.min(info.sec.rows.length-1,Math.floor(info.sec.rows.length*.35))].id; if(S.seatIdx>=0 && S.seats[S.seatIdx].sectionId!==id) S.seatIdx=-1; }
  if(!silent && changed) track('section_view',{ section_id:id, price_category:info.sec.priceCategory, source });
  if(S.mode==='seat' && changed) goOverview();
  renderMapSel(); renderSectionCard(); renderRowSeat(); renderSeatbar(); GL.paint();
}
function recommendedSeat(id){
  const info=S.sections.get(id), rows=info.sec.rows; const start=Math.floor(rows.length*.35);
  const order=[...rows.keys()].sort((a,b)=>Math.abs(a-start)-Math.abs(b-start));
  for(const ri of order){ const idxs=info.rows.get(rows[ri].id); const mid=(idxs.length-1)/2;
    const c=[...idxs].sort((a,b)=>Math.abs(S.seats[a].si-mid)-Math.abs(S.seats[b].si-mid)).find(i=>!S.seats[i].sold&&!S.seats[i].obs); if(c!==undefined) return S.seats[c].code; }
  return S.seats[info.seatIdx[0]].code;
}
function selectSeat(code,{source='picker'}={}){
  const rec=S.byCode.get(code); if(!rec) return;
  const short=S.mode==='seat' && S.seatIdx>=0;
  if(S.seatIdx===rec.i && S.mode==='seat') return;
  endSeatView();
  const secChanged=S.sectionId!==rec.sectionId;
  S.sectionId=rec.sectionId; S.rowId=rec.rowId; S.seatIdx=rec.i;
  if(secChanged) track('section_view',{ section_id:rec.sectionId, price_category:rec.cat, source });
  track('seat_view',{ ticket_code:rec.code, section_id:rec.sectionId, row:rec.rowId, seat:rec.seatId, price_category:rec.cat, available:!rec.sold, obstructed:rec.obs?rec.obs.severity:false, source });
  S.viewStart={code:rec.code, sec:rec.sectionId, t:performance.now()};
  if(S.compare) track('compare_view',{ ticket_code:rec.code, section_id:rec.sectionId, price_category:rec.cat, source });
  renderMapSel(); renderSectionCard(); renderRowSeat(); renderSeatbar();
  if(GL.ok){ GL.paint(); GL.toSeat(rec, short); } else { S.mode='seat'; }
  setModeUI('seat'); showHint();
}
function goOverview(instant){
  endSeatView();
  if(GL.ok) GL.toOverview(instant); else S.mode='overview';
  setModeUI('overview');
}
function stepSeat(dir){ const r=S.seats[S.seatIdx]; if(!r) return; const idxs=S.sections.get(r.sectionId).rows.get(r.rowId); const j=idxs.indexOf(r.i)+dir; if(j>=0&&j<idxs.length) selectSeat(S.seats[idxs[j]].code,{source:'nav'}); }
function stepRow(dir){ const r=S.seats[S.seatIdx]; if(!r) return; const sec=S.sections.get(r.sectionId).sec; const ri=r.ri+dir; if(ri<0||ri>=sec.rows.length) return;

  let best=idxs[0]; idxs.forEach(i=>{ if(Math.abs(S.seats[i].si-target)<Math.abs(S.seats[best].si-target)) best=i; }); selectSeat(S.seats[best].code,{source:'nav'}); }

/* Blok haritası: yüklenen mekânın bloklarından otomatik üretilir (üstten görünüm, X→sağ, Z→aşağı).
   Tiyatro/konser salonunda katlar (parter, balkon) üst üste bindiği için her kat ayrı bir panelde, sahne en üstte çizilir. */
const LEVEL_ORDER=['floor','lower','vip','middle','upper'];
function levelName(tier){ const k='lvl_'+tier; const v=t(k); return v===k? t('tier_'+tier) : v; }
function renderMap(){
  const svg=$('map'), v=S.venue.venue, org=venueOrigin(v), stageV=org==='stage-front-center';
  const box=()=>({minX:1e9,maxX:-1e9,minZ:1e9,maxZ:-1e9});
  const grow=(b,e)=>{ b.minX=Math.min(b.minX,e[0]); b.maxX=Math.max(b.maxX,e[0]); b.minZ=Math.min(b.minZ,e[2]); b.maxZ=Math.max(b.maxZ,e[2]); };
  // Kat panelleri (yalnız sahne orijinli mekânda ve birden çok kat varsa)
  const groups=new Map();
  S.sections.forEach((info,id)=>{ const k=stageV? info.sec.tier||'lower' : 'all'; if(!groups.has(k)) groups.set(k,{key:k, ids:[], b:box()}); const g=groups.get(k); g.ids.push(id); info.seatIdx.forEach(i=>grow(g.b,S.seats[i].eye)); });
  const panels=[...groups.values()].sort((x,y)=>LEVEL_ORDER.indexOf(x.key)-LEVEL_ORDER.indexOf(y.key));
  const all=box(); panels.forEach(g=>{ grow(all,[g.b.minX,0,g.b.minZ]); grow(all,[g.b.maxX,0,g.b.maxZ]); });
  const W=all.maxX-all.minX, fs=Math.max(1.1,Math.min(3.1,W/30)), gap=fs*3.2;
  S.mapOffset=new Map();
  let html='', cursor=null;
  if(stageV){ // sahne şeridi: Z<0 sahnenin içi
    const w=Math.min(W*0.62,20), d=Math.max(3,fs*3.2);
    html+=`<rect x="${(-w/2).toFixed(2)}" y="${(-d).toFixed(2)}" width="${w.toFixed(2)}" height="${d.toFixed(2)}" rx="${(fs*0.3).toFixed(2)}" fill="var(--surface-3)" stroke="var(--line-strong)" stroke-width="${(fs*0.12).toFixed(2)}"/>`+
      `<text x="0" y="${(-d/2+fs*0.32).toFixed(2)}" text-anchor="middle" style="fill:var(--muted);font-size:${(fs*0.85).toFixed(2)}px;letter-spacing:.2px">${t('stage')}</text>`;
    cursor=-d;
  } else if(v.type==='arena'||v.type==='stadium'){
    const p=v.scene&&v.scene.params; const [cl,cw]=(p&&p.court)||(v.type==='stadium'?[105,68]:[28,15]); const lw=Math.max(.2,fs*.1);
    html+=`<rect x="${-cl/2}" y="${-cw/2}" width="${cl}" height="${cw}" rx="0.6" fill="var(--surface-3)" stroke="var(--line-strong)" stroke-width="${lw}"/>`+
      `<line x1="0" y1="${-cw/2}" x2="0" y2="${cw/2}" stroke="var(--line-strong)" stroke-width="${lw}"/><circle r="${Math.min(cw*0.12,9.15)}" fill="none" stroke="var(--line-strong)" stroke-width="${lw}"/>`+
      `<text x="0" y="${(cw/2-Math.max(1.6,fs*0.6)).toFixed(2)}" text-anchor="middle" style="fill:var(--muted);font-size:${Math.max(2.2,fs*0.8).toFixed(2)}px;letter-spacing:.3px">${t('court')}</text>`;
    grow(all,[-cl/2,0,-cw/2]); grow(all,[cl/2,0,cw/2]);
  }
  let maxZ=all.maxZ, minZ=Math.min(all.minZ, stageV? cursor : all.minZ);
  panels.forEach((g,pi)=>{
    let dz=0;
    if(stageV && pi>0){ dz=(cursor+gap+fs*1.4)-g.b.minZ; }
    if(stageV){
      const top=g.b.minZ+dz;
      if(panels.length>1) html+=`<text x="${(all.minX).toFixed(2)}" y="${(top-fs*0.55).toFixed(2)}" style="fill:var(--muted);font-family:var(--font-body);font-weight:600;font-size:${(fs*0.78).toFixed(2)}px">${esc(levelName(g.key))}</text>`;
      cursor=g.b.maxZ+dz; maxZ=Math.max(maxZ,cursor);
    }
    g.ids.forEach(id=>S.mapOffset.set(id,dz));
  });
  const pad=fs*1.2;
  svg.setAttribute('viewBox',`${(all.minX-pad).toFixed(1)} ${(minZ-pad-(stageV&&panels.length>1?0:0)).toFixed(1)} ${(W+2*pad).toFixed(1)} ${(maxZ-minZ+2*pad).toFixed(1)}`);
  svg.setAttribute('aria-label',t('mapLabel'));
  S.sections.forEach((info,id)=>{
    const rows=info.sec.rows.filter(r=>r.seats.length); if(!rows.length) return;
    const dz=S.mapOffset.get(id)||0;
    const fr=rows[0].seats, lr=rows[rows.length-1].seats;
    const pts=[...fr.map(s=>s.eye), ...lr.slice().reverse().map(s=>s.eye)];
    const d='M'+pts.map(e=>e[0].toFixed(2)+' '+(e[2]+dz).toFixed(2)).join('L')+'Z';
    let cx=0,cz=0; pts.forEach(e=>{cx+=e[0];cz+=e[2]+dz;}); cx/=pts.length; cz/=pts.length;
    const sw=rows.length===1? fs*1.1 : fs*0.5;   // tek sıralı blok (loca) çizgi değil şerit olarak görünsün
    html+=`<g class="sec" data-id="${esc(id)}" tabindex="0" role="button" aria-label="${esc(secName(info.sec))}, ${esc(catName(info.sec.priceCategory))}">`+
      `<path d="${d}" fill="${catVar(info.sec.priceCategory)}" stroke="${catVar(info.sec.priceCategory)}" stroke-width="${sw.toFixed(2)}"/>`+
      `<path class="hl" d="${d}" fill="none" stroke="transparent" stroke-width="0"/>`+
      `<text x="${cx.toFixed(2)}" y="${(cz+fs*0.35).toFixed(2)}" text-anchor="middle" style="font-size:${fs.toFixed(2)}px">${esc(id)}</text></g>`;
  });
  html+='<circle id="mapSeat" r="'+(fs*0.42).toFixed(2)+'" fill="var(--accent)" stroke="var(--text)" stroke-width="'+(fs*0.15).toFixed(2)+'" style="display:none;pointer-events:none"/>';
  svg.innerHTML=html;
  svg.querySelectorAll('.sec').forEach(g=>{
    g.addEventListener('click',()=>selectSection(g.dataset.id,{source:'map'}));
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectSection(g.dataset.id,{source:'map'}); } });
  });
  renderMapSel();
}

function renderPop(){
  $('pop').innerHTML=`
    <div><label>${t('venueLbl')}</label><div class="venue-list">${VENUE_OPTIONS.map(o=>`<button data-venue="${o.id}" aria-pressed="${o.id===S.venueOpt}">${esc(o[S.lang]||o.tr)}${o.url?`<small>${esc(o.url)}</small>`:''}</button>`).join('')}</div></div>
    <div><label>${t('compare')}</label><div class="cmp-row"><button class="btn${S.compare?'':' primary'}" id="cmpBtn" type="button" aria-pressed="${!!S.compare}">${S.compare?t('compareOff'):t('compareOn')}</button></div>
      <p class="sub" style="margin-top:6px">${t('compareNote')}</p></div>
    <div><label>${t('brand')}</label><div class="brand-list">${BRAND_PRESETS.map(b=>`<button class="brand-opt" data-brand="${b.id}" aria-pressed="${b.id===BRAND.id}"><span class="bl" style="background:${b.primary};--a:${b.accent}"></span><span>${esc(b.name)}</span></button>`).join('')}</div>
      <p class="sub" style="margin-top:6px">${t('brandNote')}</p></div>
    <div><label>${t('language')}</label><div class="seg"><button data-lang="tr" aria-pressed="${S.lang==='tr'}">Türkçe</button><button data-lang="en" aria-pressed="${S.lang==='en'}">English</button></div></div>
    <div><label>${t('theme')}</label><div class="seg">${['auto','light','dark'].map(k=>`<button data-theme-opt="${k}" aria-pressed="${S.themePref===k}">${t('theme'+k[0].toUpperCase()+k.slice(1))}</button>`).join('')}</div></div>
    <div><label>${S.lang==='en'?'Smoothness test':'Akıcılık testi'}</label><button class="btn" id="perfBtn" type="button" style="width:100%">${S.lang==='en'?'Run 5-second test':'5 saniyelik testi başlat'}</button>
      <p class="sub" id="perfOut" style="margin-top:6px">${esc(LAST_PERF || (S.lang==='en'?'The scene rotates by itself for 5 seconds and frames per second are measured.':'Sahne 5 saniye kendi kendine döner, saniyedeki kare sayısı ölçülür.'))}</p></div>`;
  $('perfBtn').onclick=runPerfTest;
  $('cmpBtn').onclick=()=>{ openPop(false); setCompare(!S.compare,{source:'settings'}); };
  $('pop').querySelectorAll('[data-venue]').forEach(b=>b.onclick=()=>{ openPop(false); selectVenueOption(b.dataset.venue); });
  $('pop').querySelectorAll('[data-brand]').forEach(b=>b.onclick=()=>setBrand(b.dataset.brand));
  $('pop').querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  $('pop').querySelectorAll('[data-theme-opt]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeOpt));
}
function renderBrandSeg(){
  $('brandSegWide').innerHTML=BRAND_PRESETS.map(b=>`<button data-brand="${b.id}" aria-pressed="${b.id===BRAND.id}">${esc(b.name)}</button>`).join('');
  $('brandSegWide').querySelectorAll('[data-brand]').forEach(b=>b.onclick=()=>setBrand(b.dataset.brand));
}
let LAST_PERF='';
function gpuName(){ try{ const g=GL.renderer.getContext(); const e=g.getExtension('WEBGL_debug_renderer_info'); return e? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER); }catch(e){ return '?'; } }
async function runPerfTest(){
  if(!GL.ok || GL.bench) return;
  openPop(false); toast(S.lang==='en'?'Measuring for 5 seconds…':'5 saniye ölçülüyor, ekrana dokunmayın…');
  const r=await GL.runBench(5000);
  const v=r.fps>=30?(S.lang==='en'?'smooth':'akıcı'):r.fps>=20?(S.lang==='en'?'acceptable':'kabul edilebilir'):(S.lang==='en'?'slow':'yavaş');
  const scene=(VENUE_OPTIONS.find(o=>o.id===S.venueOpt)||{})[S.lang]||S.venueOpt;
  LAST_PERF=`${r.fps} ${S.lang==='en'?'fps':'kare/sn'} (${v}) · ${scene} · ${S.mode==='overview'?(S.lang==='en'?'overview':'genel bakış'):(S.lang==='en'?'seat view':'koltuk görünümü')} · ${innerWidth}×${innerHeight} @${devicePixelRatio}x · ${gpuName()}`;
  toast(LAST_PERF);
}
function openPop(on){ popOpen=on; $('pop').classList.toggle('on',on); $('btnSettings').setAttribute('aria-expanded',on); $('scrim').classList.toggle('on',on||drawerOpen); if(on) renderPop(); }
function save(){ if(EMBED) return; try{ localStorage.setItem('koltuk-demo',JSON.stringify({brand:BRAND.id,lang:S.lang,theme:S.themePref,venue:S.venueOpt})); }catch(e){} }
function renderEventHead(){
  const o=VENUE_OPTIONS.find(x=>x.id===S.venueOpt);
  const ev=o&&o.event&&o.event[S.lang];
  $('evTitle').textContent=ev?ev[0]:t('eventTitle');
  let meta=ev?ev[1]:t('eventMeta');
  if(S.splatStats && S.venue && S.venue.venue.scene && S.venue.venue.scene.kind==='splat') meta+=' · '+t('splatInfo').replace('{n}',fmtInt(S.splatStats.count)).replace('{mb}',(S.splatStats.bytes/1048576).toFixed(1));
  $('evMeta').textContent=meta;
}
function showLoading(txt,p){ const el=$('loading'); el.hidden=false; $('loadingTxt').textContent=txt+(p>0?' '+Math.round(p*100)+'%':''); $('loadingBar').style.width=Math.round((p||0)*100)+'%'; }
function hideLoading(){ $('loading').hidden=true; }

function setBrand(idOrObj){
  const b=typeof idOrObj==='string'? BRAND_PRESETS.find(x=>x.id===idOrObj) : idOrObj; if(!b) return;
  BRAND=Object.assign({}, BRAND_PRESETS[0], b);
  const r=document.documentElement.style;
  r.setProperty('--brand',BRAND.primary); r.setProperty('--brand-ink',BRAND.primaryInk); r.setProperty('--accent',BRAND.accent); r.setProperty('--accent-ink',BRAND.accentInk);
  $('logoText').textContent=BRAND.logoText; $('powered').style.display=BRAND.showPoweredBy?'':'none';
  renderBrandSeg(); if(popOpen) renderPop(); GL.applyBrand(); save();
}
function setLang(l){
  S.lang=l; document.documentElement.lang=l;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $('drClose').setAttribute('aria-label',t('close'));
  if(S.venue){ renderEventHead(); renderMap(); renderLegend(); renderSectionCard(); renderRowSeat(); renderSeatbar(); setModeUI(S.mode==='seat'||GL.tween&&S.seatIdx>=0?'seat':'overview');
    $('capacityLbl').textContent=t('capacity').replace('{n}',fmtInt(S.seats.length)); }
  renderCompareUI(); if(popOpen) renderPop(); if(drawerOpen) renderAnalytics(); GL.applyBrand(); save();
}
function setTheme(pref){
  S.themePref=pref; const el=document.documentElement;
  if(pref==='auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme',pref);
  if(popOpen) renderPop(); GL.applyTheme(); save();
}

/* =====================================================================
   10) BAŞLAT + GÖMME API'si
   ===================================================================== */
function boot(){
  let pref={}; try{ if(!EMBED) pref=JSON.parse(localStorage.getItem('koltuk-demo')||'{}')||{}; }catch(e){}
  if(EMBED) document.documentElement.classList.add('embed');
  ['brand','lang','theme','venue'].forEach(k=>{ if(QS.get(k)) pref[k]=QS.get(k); });
  S.lang=pref.lang==='en'?'en':'tr'; S.themePref=['light','dark'].includes(pref.theme)?pref.theme:'auto';
  if(S.themePref!=='auto') document.documentElement.setAttribute('data-theme',S.themePref);
  if(typeof THREE==='undefined'){ GL.ok=false; GL.fail(); } else GL.init();
  setBrand(pref.brand||BRAND.id);
  setLang(S.lang);
  const vOpt=VENUE_OPTIONS.find(o=>o.id===pref.venue);
  // Uzak (url'li) mekân seçiliyse önce prosedürel demoyu kurup atmak yerine doğrudan onu yükle (hata olursa demo yüklenir).
  if(vOpt && vOpt.url) selectVenueOption(vOpt.id);
  else if(vOpt && vOpt.id!=='demo') { loadVenue(generateDemoVenue(),{optId:'demo', baseUrl:document.baseURI}); selectVenueOption(vOpt.id); }
  else loadVenue(generateDemoVenue(),{optId:'demo', baseUrl:document.baseURI});
  $('btnOverview').onclick=()=>goOverview();
  $('btnCmpOff').onclick=()=>setCompare(false,{source:'button'});
  if(QS.get('mod')==='karsilastir') setCompare(true,{source:'url'});
  $('btnAnalytics').onclick=()=>{ openPop(false); openDrawer(!drawerOpen); };
  $('btnSettings').onclick=e=>{ e.stopPropagation(); openDrawer(false); openPop(!popOpen); };
  $('drClose').onclick=()=>openDrawer(false);
  $('scrim').onclick=()=>{ openDrawer(false); openPop(false); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(drawerOpen) openDrawer(false); if(popOpen) openPop(false); } });
  $('rowSel').onchange=e=>{ S.rowId=e.target.value; renderRowSeat(); };
  $('strip').onclick=e=>{ const b=e.target.closest('button[data-code]'); if(b) selectSeat(b.dataset.code,{source:'picker'}); };
  if(window.matchMedia){ const mq=window.matchMedia('(prefers-color-scheme: dark)'); const f=()=>GL.applyTheme(); mq.addEventListener?mq.addEventListener('change',f):mq.addListener(f); }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>GL.applyBrand());
  // Üst pencere (iframe gömme) → görüntüleyici komutları
  window.addEventListener('message',e=>{ if(!hostMessageAllowed(e)) return;
    const m=e.data;
    if(m.type==='koltuk:selectSeat') selectSeat(m.ticketCode,{source:'host'});
    if(m.type==='koltuk:selectSection') selectSection(m.sectionId,{source:'host'});
    if(m.type==='koltuk:overview') goOverview();
    if(m.type==='koltuk:setBrand') setBrand(m.brand);
    if(m.type==='koltuk:loadVenue') loadVenue(m.venue);
    if(m.type==='koltuk:selectVenue') selectVenueOption(m.venueId);
    if(m.type==='koltuk:setLang' && (m.lang==='tr'||m.lang==='en')) setLang(m.lang);
    if(m.type==='koltuk:setCompare') setCompare(!!m.on,{source:'host'});
    if(m.type==='koltuk:setTheme' && ['auto','light','dark'].includes(m.theme)) setTheme(m.theme); });
  postToHost({type:'koltuk:ready', version:'0.2.0', venue_id:S.venue&&S.venue.venue.id});
  // Dar ekranda içerik yüksekliğini bildir: host iframe'i büyütür, iç içe kaydırma olmaz.
  if(window.parent!==window){ let last=0; const sendH=()=>{ const h=Math.ceil(document.documentElement.scrollHeight); if(Math.abs(h-last)>2){ last=h; postToHost({type:'koltuk:resize', height:h}); } };
    try{ new ResizeObserver(sendH).observe(document.body); }catch(e){} window.addEventListener('resize',sendH); setTimeout(sendH,300); }
}
window.loadVenue=loadVenue;
window.KoltukViewer={ loadVenue, selectSection:(id)=>selectSection(id,{source:'api'}), selectSeat:(c)=>selectSeat(c,{source:'api'}), overview:()=>goOverview(),
  setBrand, setLang, setTheme, getEvents:()=>S.events.slice(), generateDemoVenue, get BRAND(){return BRAND;}, selectVenue:selectVenueOption,
  bench:(ms)=>GL.runBench(ms||3000), setCompare:(on)=>setCompare(on,{source:'api'}),
  compareInfo:()=>({ on:!!S.compare, stack:!!GL.stack, panels:(GL.panels()||[]).map(p=>({ adapter:p.adapter.constructor.name, rect:[p.x,p.y,p.w,p.h], splatLoaded:!!p.adapter.splat })),
    camera:GL.ok?GL.camera.position.toArray().map(v=>+v.toFixed(3)):null, aspect:GL.ok?+GL.camera.aspect.toFixed(3):null }), _gl:()=>GL, getSplatStats:()=>S.splatStats||null,
  sceneInfo:()=>({ adapter:GL.adapter&&GL.adapter.constructor.name, splatLoaded:!!(GL.adapter&&GL.adapter.splat), splatFailed:!!(GL.adapter&&GL.adapter.failed), autoShell:!!(GL.adapter&&GL.adapter.treads), venueOpt:S.venueOpt, seats:S.seats.length }),
  getState:()=>({ mode:S.mode, sectionId:S.sectionId, seat:S.seatIdx>=0?S.seats[S.seatIdx].code:null, tweening:!!(GL.tween),
    camera:GL.ok?{ position:GL.camera.position.toArray().map(v=>+v.toFixed(2)), fov:+GL.camera.fov.toFixed(1) }:null }) };
boot();
})();
</script>
